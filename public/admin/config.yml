backend:
  name: git-gateway
  branch: main 

local_backend: true
publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "newsletter"
    label: "Newsletter Posts"
    label_singular: "Newsletter Post"
    folder: "content/newsletter"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Publish date", widget: "datetime", format: "YYYY-MM-DD" }
      - { name: "author", label: "Author", widget: "string", default: "WiCyS Northeastern" }
      - {
          name: "tags",
          label: "Tags",
          widget: "list",
          required: false,
          hint: "e.g. Events, Policy, Threats, CTF",
        }
      - {
          name: "excerpt",
          label: "Excerpt",
          widget: "text",
          hint: "1–2 sentence summary shown on cards.",
        }
      - { name: "coverImage", label: "Cover image", widget: "image", required: false }
      - {
          name: "featured",
          label: "Feature on home page",
          widget: "boolean",
          default: false,
          required: false,
        }
      - { name: "body", label: "Body", widget: "markdown" }

  - name: "events"
    label: "Events & Announcements"
    label_singular: "Event"
    folder: "content/events"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - {
          name: "date",
          label: "Event date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          hint: "Events on or after today show under “Upcoming”; earlier ones under “Past”.",
        }
      - {
          name: "endDate",
          label: "End date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          required: false,
          hint: "Only for multi-day events.",
        }
      - {
          name: "time",
          label: "Time",
          widget: "string",
          required: false,
          hint: "e.g. 5:30–7:00 PM",
        }
      - { name: "location", label: "Location", widget: "string", required: false }
      - {
          name: "tags",
          label: "Tags",
          widget: "list",
          required: false,
          hint: "e.g. Workshop, Social, CTF, Speaker",
        }
      - {
          name: "excerpt",
          label: "Short description",
          widget: "text",
          hint: "1–2 sentence summary shown on the event card.",
        }
      - {
          name: "registrationUrl",
          label: "Registration / RSVP link",
          widget: "string",
          required: false,
          hint: "Shown as a button on upcoming events.",
        }
      - { name: "coverImage", label: "Cover image", widget: "image", required: false }
      - { name: "body", label: "Details", widget: "markdown", required: false }
      - { name: "completed", label: "Event completed", widget: "boolean", default: false, required: false, hint: "Show in Past events even if the event date is today." }
      - name: "gallery"
        label: "Thumbnail slideshow photos"
        widget: "list"
        required: false
        field: { name: "image", label: "Photo", widget: "image" }
      - { name: "imageFit", label: "Thumbnail image fit", widget: "select", options: ["cover", "contain"], default: "cover", required: false, hint: "Use contain for flyers to show the full image." }
      - { name: "registrationLabel", label: "Link button text", widget: "string", required: false }

  - name: "conferences"
    label: "Conference Recaps"
    label_singular: "Conference Recap"
    folder: "content/conferences"
    create: true
    slug: "{{slug}}"
    summary: "{{conference}} — {{author}}"
    sortable_fields: ["date", "conference"]
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - {
          name: "conference",
          label: "Conference",
          widget: "string",
          hint: "e.g. WiCyS 2025",
        }
      - { name: "date", label: "Date", widget: "datetime", format: "YYYY-MM-DD" }
      - { name: "location", label: "Location", widget: "string", required: false }
      - { name: "author", label: "Member name", widget: "string" }
      - {
          name: "role",
          label: "Role / year",
          widget: "string",
          required: false,
          hint: "e.g. CS ’26, Chapter member",
        }
      - {
          name: "coverImage",
          label: "Cover photo",
          widget: "image",
          required: false,
        }
      - {
          name: "gallery",
          label: "Gallery photos",
          widget: "list",
          required: false,
          field: { name: "image", label: "Photo", widget: "image" },
        }
      - {
          name: "excerpt",
          label: "Short quote / summary",
          widget: "text",
          required: false,
        }
      - { name: "body", label: "Experience", widget: "markdown" }

  - name: "research"
    label: "Research"
    label_singular: "Research Project"
    folder: "content/research"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{type}}"
    sortable_fields: ["title", "type", "order"]
    fields:
      - { name: "title", label: "Research topic", widget: "string" }
      - {
          name: "type",
          label: "Section",
          widget: "select",
          options: [{ label: "Student research", value: "student" }, { label: "Faculty research", value: "faculty" }],
          default: "student",
        }
      - {
          name: "researchers",
          label: "Researchers",
          widget: "list",
          hint: "Names of the students or faculty involved.",
        }
      - {
          name: "affiliation",
          label: "Department / lab / advisor",
          widget: "string",
          required: false,
          hint: "e.g. Khoury College of Computer Sciences",
        }
      - {
          name: "status",
          label: "Status",
          widget: "select",
          options: ["Ongoing", "Completed", "Published"],
          required: false,
        }
      - {
          name: "tags",
          label: "Research areas",
          widget: "list",
          required: false,
          hint: "e.g. Network Security, Privacy, AI Security",
        }
      - {
          name: "summary",
          label: "Brief description",
          widget: "text",
          hint: "1–2 sentences shown before the card is opened.",
        }
      - {
          name: "link",
          label: "Paper / project link",
          widget: "string",
          required: false,
        }
      - {
          name: "order",
          label: "Display order",
          widget: "number",
          default: 100,
          required: false,
          hint: "Lower numbers appear first.",
        }
      - { name: "body", label: "Full description", widget: "markdown", required: false }
      - { name: "coverImage", label: "Research graphic", widget: "image", required: false }
      - { name: "imageAlt", label: "Graphic description", widget: "string", required: false }
